name: funapp
description: funapp for farfarfun
repository: https://github.com/farfarfun/funapp-bak/tree/master/funapp

version: 0.3.6

environment:
  sdk: ">=2.16.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  dio: ^4.0.6
  carousel_slider: ^4.1.1
  fijkplayer: ^0.10.1
  wakelock: ^0.6.1+2
  inview_notifier_list: ^3.0.0
  shared_preferences: ^2.0.15
  flutter_settings_screens: ^0.3.3-null-safety+1
  cryptography: ^2.0.5

  # 基础的点击
  tapped: ^2.0.0
  # map取值
  safemap: ^2.1.0
  # 加载动画库
  flutter_spinkit: ^5.1.0
  # 播放器
  video_player: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
