name: noteapp
description: noteapp for notechats
repository: https://github.com/notechats/noteapp/tree/master/noteapp

version: 0.0.2

environment:
  sdk: ">=2.16.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  fluttertoast: ^8.0.9
  screen_brightness: ^0.2.0
  volume_controller: ^2.0.3

  cupertino_icons: ^1.0.2
  carousel_slider: ^4.1.1

  fijkplayer: ^0.10.1
  wakelock: ^0.6.1+2
  wakelock_web: ^0.4.0
  provider: ^6.0.2
  inview_notifier_list: ^3.0.0
  noteflutter: ^0.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
