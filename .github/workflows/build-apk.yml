# main.yml
# 自动构建 Apk
name: Build and Release apk

# 工作流程触发的时机，这里是当一个版本标签推送到仓库时触发
on:
  push:
    tags:
      - v*

# 防止连续打 tag 时并行触发多个发布 run 互相竞态覆盖产物
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# 这个工作流程需要执行的任务
jobs:
  process:
    name: all process
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./funapp
    # 这个任务的步骤
    steps:
      # 拉取项目代码
      - uses: actions/checkout@v4
      # 建立 java 环境
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' 
          java-version: "11"
      # 建立 Flutter 环境
      - name: Flutter action
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.0.0"
            
      # 下载项目依赖
      - run: flutter pub get
      - run: echo $ENCODED_KEYSTORE | base64 -di > android/app/keystore.jks
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}
      # 打包 APK
      # - run: flutter build apk --release  --split-per-abi --no-shrink
      - run: flutter build apk --release  --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD}}

      # 发布到 Release
      - name: Release apk
        uses: ncipollo/release-action@58ae73b360456532aafd58ee170c045abbeaee37 # v1.10.0
        with:
          artifacts: "funapp/build/app/outputs/apk/release/*.apk"
          token: ${{ secrets.RELEASE_TOKEN }}
